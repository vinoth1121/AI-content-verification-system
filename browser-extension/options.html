<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>ACVS Options</title>
  <style>
    body { font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 24px; max-width: 480px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input { width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; }
    button { background: #10b981; color: #fff; border: 0; border-radius: 6px; padding: 8px 16px; cursor: pointer; margin-top: 12px; }
    #saved { color: #10b981; font-size: 12px; margin-left: 8px; }
  </style>
</head>
<body>
  <h1>ACVS Options</h1>
  <label for="apiBase">Backend URL</label>
  <input id="apiBase" type="url" />
  <button id="save">Save</button>
  <span id="saved"></span>
  <script src="options.js"></script>
</body>
</html>
