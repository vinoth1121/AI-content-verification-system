<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>ACVS</title>
  <style>
    body { width: 320px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 12px; }
    h1 { font-size: 16px; margin: 0 0 6px; }
    h2 { font-size: 12px; margin: 12px 0 4px; color: #6b7280; text-transform: uppercase; }
    header p { font-size: 11px; color: #6b7280; margin: 0 0 8px; }
    label { display: block; font-size: 11px; color: #374151; margin-bottom: 6px; }
    input, textarea { width: 100%; padding: 6px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; font: inherit; }
    textarea { resize: vertical; }
    button { background: #10b981; color: #fff; border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; width: 100%; margin-top: 6px; }
    button:hover { background: #059669; }
    .err { color: #f43f5e; font-size: 11px; min-height: 14px; }
    .card { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px; margin-top: 8px; }
    .card p { font-size: 11px; color: #4b5563; margin: 4px 0 0; }
    footer { margin-top: 12px; }
    footer button { background: #fff; color: #374151; border: 1px solid #d1d5db; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="popup.js"></script>
</body>
</html>
