name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run tests
        env:
          JWT_SECRET: ci-secret-must-be-at-least-32-characters-long-abcdef
          DATABASE_URL: sqlite:///./acvs-test.db
          CORS_ORIGINS: '["http://localhost:3000"]'
        run: |
          cd backend && pytest -v --cov=app

  ai-engine-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r ai-engine/requirements.txt
      - name: Run tests
        env:
          PYTHONPATH: ai-engine
        run: |
          cd ai-engine && pytest -v

  # NOTE: dashboard-lint and extension-lint jobs are temporarily disabled.
  # - The admin dashboard currently lives in the workspace's Next.js project
  #   root, not under repo/admin-dashboard/ (which is empty in the repo).
  # - The browser extension's package-lock.json has not been committed yet.
  # Both jobs will be re-enabled in a follow-up commit once the dashboard is
  # moved into the repo and the extension lockfile is generated.
