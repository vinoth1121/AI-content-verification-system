name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run tests
        env:
          JWT_SECRET: ci-secret-must-be-at-least-32-characters-long-abcdef
          DATABASE_URL: sqlite:///./acvs-test.db
          CORS_ORIGINS: '["http://localhost:3000"]'
        run: |
          cd backend && pytest -v --cov=app

  ai-engine-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r ai-engine/requirements.txt
      - name: Run tests
        run: |
          cd ai-engine && pytest -v

  dashboard-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: admin-dashboard
        run: npm ci
      - name: Lint
        working-directory: admin-dashboard
        run: npm run lint

  extension-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: browser-extension
        run: npm ci
      - name: Lint
        working-directory: browser-extension
        run: npm run lint
